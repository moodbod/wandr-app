<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9fe870" />
    <title>Wandr — Offline</title>
    <style>
      :root {
        --background: #fffaf2;
        --accent: #9fe870;
        --foreground: #1a1a1a;
        --muted: #5f5a53;
      }
      
      * { box-sizing: border-box; }

      body {
        align-items: center;
        background: var(--background);
        color: var(--foreground);
        display: flex;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100dvh;
        padding: 24px;
        text-align: center;
      }

      main {
        max-width: 320px;
        width: 100%;
      }

      .icon-container {
        background: white;
        border-radius: 24px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        display: inline-flex;
        margin-bottom: 32px;
        padding: 20px;
      }

      img {
        height: 64px;
        width: 64px;
      }

      h1 {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin: 0 0 16px;
      }

      p {
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
        margin: 0 0 32px;
      }

      .btn {
        background: var(--foreground);
        border: none;
        border-radius: 100px;
        color: white;
        cursor: pointer;
        display: block;
        font-size: 15px;
        font-weight: 600;
        padding: 16px 32px;
        text-decoration: none;
        transition: transform 0.2s ease;
        width: 100%;
      }

      .btn:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon-container">
        <img src="/icons/wandr-icon.png" alt="Wandr" />
      </div>
      <h1>You're off the grid.</h1>
      <p>Reconnect to keep exploring fresh Wandr places and routes.</p>
      <button class="btn" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
