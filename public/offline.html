<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff6740" />
    <title>Wandr is offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #fffaf2;
        color: #1a1a1a;
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        max-width: 28rem;
      }

      img {
        height: 64px;
        margin-bottom: 24px;
        width: 64px;
      }

      h1 {
        font-size: clamp(2rem, 9vw, 3.5rem);
        line-height: 0.95;
        margin: 0 0 16px;
      }

      p {
        color: #5f5a53;
        font-size: 1rem;
        line-height: 1.6;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline.</h1>
      <p>Reconnect to keep exploring fresh Wandr places and routes.</p>
    </main>
  </body>
</html>
